<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Action Items - Rajasekaran-Selvaraj-Hub</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="maple-icon">Tasks</div>
        <div>
          <h1>Action Items</h1>
          <p class="header-sub">Create sub tabs, manage tasks, and mark completion.</p>
        </div>
      </div>
      <div class="header-right">
        <nav class="tab-nav" aria-label="Primary">
          <a class="tab-link" href="index.html">PR Dashboard</a>
          <a class="tab-link" href="h1b.html">H1B Tracker</a>
          <a class="tab-link active" href="action-items.html">Action Items</a>
        </nav>
        <button class="top-link" id="logoutBtn" type="button">Logout</button>
        <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">Dark</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">Sub Tabs</h2>
      <div class="card">
        <div class="action-top-bar">
          <input class="sheet-input" id="newTabName" placeholder="Add sub tab (example: PR Docs, Job Search, Personal)" />
          <button class="btn btn-primary" id="addTabBtn" type="button">Add Sub Tab</button>
        </div>
        <div id="tabList" class="subtab-list"></div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Tasks</h2>
      <div class="card">
        <div class="action-top-bar">
          <input class="sheet-input" id="newTaskTitle" placeholder="Add action item for selected sub tab" />
          <button class="btn btn-primary" id="addTaskBtn" type="button">Add Task</button>
          <button class="btn" id="clearCompletedBtn" type="button">Delete Completed</button>
        </div>

        <div id="selectedTabLabel" class="selected-tab-label">Selected: -</div>
        <div id="taskList" class="task-list"></div>
        <p class="save-status" id="actionStatus"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Rajasekaran-Selvaraj-Hub - Action Items</p>
    <p class="footer-sub">Synced with your secure account.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="action-items.js"></script>
</body>
</html>
